name: update

# Keeps Formula/*.rb in sync with each product's latest signed release, the same
# pull model as Glyndor/apt: no product pushes here. This reads their public
# releases, verifies the signed SHA256SUMS against the org release key, validates
# the re-rendered formulae, and commits them straight to `main`, GitHub-signed
# via the createCommitOnBranch mutation, so a new release reaches
# `brew upgrade` without any product holding a credential here. The schedule
# below asks for every hour and GitHub fires it later than that, so a release
# is usually served within a few hours, and at once when this is run by hand.
#
# Why a direct commit and not a pull request: the organisation forbids GitHub
# Actions from creating or approving PRs (a locked, org-wide setting), so the
# apt-style "open an auto-merging PR" path is unavailable. Unlike Glyndor/apt,
# whose automation never writes git but publishes to R2, a tap's git content
# *is* the published artifact, so the update must land as a commit. It lands on
# `main` directly, validated in this workflow *before* it lands (there is no PR
# gate standing between the commit and `brew install`), and signed by GitHub so
# `main`'s require-signed-commits rule accepts it without a signing key here.
#
# A schedule and a manual button, and no `pull_request` trigger, because none of
# this is about a pull request: it reads each product's latest signed release and
# re-renders the published artifact. That is also why validation runs inside
# this workflow before the commit, no pull request review stands between that
# commit and somebody's `brew install`.
#
# Three jobs, and the split is the security boundary, not tidiness:
#
#   render    renders Formula/, holds it to the roster, and records the SHA-256
#             of every file in its job outputs. No secret.
#   validate  runs `brew style` and `brew audit --strict` on those bytes. No
#             secret. Homebrew installs the Ruby gems those commands need from
#             RubyGems when they are missing, so this job runs code nobody here
#             chose, and it is kept away from the key for that reason.
#   commit    the only job that mints the updater app's token. It runs no
#             `brew` and installs nothing; it checks the files it is about to
#             commit against the digests the render job recorded, holds them to
#             the roster again, and commits them.
#
# When all of this was one job, whatever ran during `brew style` could rewrite
# a formula, or the `gh` and `jq` the commit step runs, in the workspace the
# commit step then used with the app's token. Secrets reach a step only when it
# names them, so the gems could not read the key; what they could do was
# persist into the step that does. Separate jobs share no workspace, and the
# digests travel through job outputs, which `validate` cannot write.
on:
  schedule:
    # Hourly, at :30 to stay clear of the queue that forms on the hour and to
    # keep the historical offset from apt's 06:00 publish.
    #
    # Was daily. The 24-hour worst case between a product publishing and this
    # channel serving it was the cron, not the pull model: a security fix could
    # sit a day behind with the short path already built and unused.
    #
    # The push alternative is not used. update.yml carries a
    # repository_dispatch trigger a product could POST to, but a push
    # model would let a compromised release workflow write into the
    # distribution channels, and a channel-write token would put signing, the
    # registry and both channels behind one compromise. Pulling more often buys
    # most of the latency back and moves no credential.
    #
    # Cheap, measured rather than assumed: a run of the single job this used
    # to be took 20 to 52 seconds. A run with nothing new is not free: the
    # renderer still downloads every asset of each latest release and verifies
    # its provenance, because a shortcut for "already served" would take the
    # served formula's word for what it never re-checks. What a run with no
    # change skips is the validation and the commit. The macOS audit is not
    # part of this workflow: audit.yml runs it on the push each commit raises
    # and on its own daily schedule.
    - cron: "30 * * * *"
  workflow_dispatch:
  # Optional instant trigger: a product's release workflow may
  # POST /repos/Glyndor/homebrew-tap/dispatches with event_type "release".
  # Nothing is wired to it today; the hourly schedule is the baseline.
  repository_dispatch:
    types: [release]

permissions:
  contents: read

# Never run two updates at once: they would race on main's HEAD (the second
# would fail its expectedHeadOid check and drop the update to the next run).
# The group covers the whole run, all three jobs.
concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  render:
    name: Render
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured over the last eight runs before the audit was added, the whole
    # single job (render, `brew style` and the commit) took 15 to 24 seconds,
    # and this job is the render part of it. Ten minutes is far above that and
    # far below the six-hour default a hang would otherwise burn every hour.
    # This job has not been timed on its own yet.
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.render.outputs.changed }}
      partial: ${{ steps.render.outputs.partial }}
      digests: ${{ steps.digests.outputs.digests }}
      head: ${{ steps.digests.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography
          # The ML-DSA-65 half of the release signature needs cryptography
          # 50.0.2, which the distribution does not carry. It is installed only
          # once the renderer's ML-DSA-65 key slot holds a key, the first
          # moment a second signature can be checked at all: until then the
          # renderer refuses a SHA256SUMS.mldsa65.sig before the library is
          # needed, and this job installs nothing from PyPI. The wheel is
          # pinned by hash and binary only, so nothing is resolved at install
          # time and no build script runs in the job that holds no secret; the
          # venv lives outside the workspace.
          if grep -qE '^RELEASE_PQ_PUBKEY2?_B64="[A-Za-z0-9+/]+={0,2}"$' scripts/release/render-formulae.sh; then
            python3 -m venv "$RUNNER_TEMP/mldsa-venv"
            "$RUNNER_TEMP/mldsa-venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/release/render-requirements.txt
          fi

      - name: Render formulae from the latest signed releases
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The install step built the virtual environment with the ML-DSA-65
          # capable cryptography, and only when the renderer's key slot holds
          # a key. Its python comes first on PATH so the renderer verifies the
          # second signature with it; without a key there is no venv and the
          # render runs on the distribution's python3-cryptography, which has
          # no ML-DSA and needs none.
          mldsa_venv="${RUNNER_TEMP:-}/mldsa-venv"
          if [ -x "$mldsa_venv/bin/python3" ]; then
            PATH="$mldsa_venv/bin:$PATH"
          fi
          # Exit 3 means the generator skipped at least one product and rendered
          # the rest: its release was unreadable, its SHA256SUMS did not verify,
          # or an asset the table names was missing. Carry on and commit what did
          # render, then fail the run in the last step so the skip is loud.
          # Holding a good update back because an unrelated product's release is
          # broken is exactly what this replaced. Any other non-zero is a failure
          # before any product was reached, and stops the run here.
          rc=0
          bash ./scripts/release/render-formulae.sh || rc=$?
          case "$rc" in
            0) echo "partial=0" >> "$GITHUB_OUTPUT" ;;
            3) echo "partial=1" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          # Three kinds of change count: a tracked formula modified in place,
          # a brand-new one git has never seen before, and a tracked one the
          # renderer removed. Without the third, deleting a product leaves its
          # formula published: the renderer removes it from the working tree,
          # the gate does not see it (`--diff-filter=ACMR` filters deletions
          # out), and the commit step never runs. Adds (ACMR + untracked) and
          # dels (D) stay separate because an untracked path can never be a
          # deletion, matching the additions/deletions split the commit step
          # already uses.
          adds_paths="$(git diff --name-only --diff-filter=ACMR -- Formula
                        git ls-files -o --exclude-standard -- Formula)"
          dels_paths="$(git diff --name-only --diff-filter=D -- Formula)"
          # Refuse a deletion-only render that would empty the channel. The
          # validate step's empty-tap guard would still catch it, but only
          # after this step has run; on the cron, that turns into a red nobody
          # can clear and no pull request to fix. Catching it here is the only
          # way the refusal carries a name and an actionable message.
          if [ -n "$dels_paths" ] && [ -z "$adds_paths" ]; then
            # Tracked formulae that survive the deletion: the tracked set
            # minus the deleted paths. If nothing survives, the deletion
            # would leave Formula/ empty. The `|| true` is needed because
            # `grep` returns 1 when there are no matches, and a failed
            # assignment under `set -e` would exit the script before the
            # emptiness check below.
            remaining="$(git ls-files -- Formula | grep -Fxvf <(printf '%s\n' "$dels_paths") || true)"
            if [ -z "$remaining" ]; then
              echo "::error::the render would empty the channel; refusing to commit an empty tap"
              exit 1
            fi
          fi
          if [ -z "$adds_paths" ] && [ -z "$dels_paths" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "No formula changed."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # The CONTENT of every formula, against the roster row the generator
      # renders from: the same repository, the same tag on every url, the
      # assets that row declares, and no statement the generator does not
      # write. `brew style` and `brew audit --strict` read a formula as Ruby
      # and as a Homebrew recipe, and neither of them knows what the product's
      # release looked like, so both accept a formula that is well formed and
      # wrong: a url naming another Glyndor repository, a second tag in the
      # same formula, a `post_install` block that runs on every install.
      # Glyndor/scoop-bucket refuses the same shapes for its manifests.
      #
      # It runs here, before anything leaves this job, because the check needs
      # no toolchain and a formula that says the wrong thing should not reach
      # the job where Homebrew is set up to find out. The commit job runs it
      # again on the bytes it commits.
      - name: Hold the rendered formulae to the roster
        if: steps.render.outputs.changed == '1'
        run: bash ./scripts/artifacts/check-formulae.sh

      # The manifest goes to the next jobs twice, and only one copy counts.
      # The copy in the artifact is for a person reading a run. The one the
      # commit job checks travels in this job's outputs: `validate` downloads
      # the artifact and holds the run's token, which can upload artifacts, so
      # anything inside the artifact is something it could replace. A job's
      # outputs are written by that job alone. The head this job rendered from
      # travels the same way, because the commit job's diff is only right
      # against the same parent.
      - name: Record the digest of every rendered file
        id: digests
        if: steps.render.outputs.changed == '1'
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/rendered"
          manifest="$RUNNER_TEMP/formulae.sha256"
          bash ./scripts/artifacts/formulae-digests.sh list . > "$manifest"
          rm -rf "$staged"
          mkdir -p "$staged"
          cp -R Formula "$staged/Formula"
          cp "$manifest" "$staged/formulae.sha256"
          bash ./scripts/artifacts/formulae-digests.sh check "$staged" "$manifest"
          echo "digests=$(base64 -w0 < "$manifest")" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Seven days so a red run can still be read; the artifact is only a
      # carrier between the jobs of one run.
      - name: Upload the rendered formulae
        if: steps.render.outputs.changed == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-formulae
          path: ${{ runner.temp }}/rendered
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate
    needs: render
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # No secret reaches this job and none may: it runs Homebrew, and Homebrew
    # installs gems from RubyGems on demand.
    permissions:
      contents: read
    # The validate step runs `brew style` and `brew audit --strict`, and brew
    # updates itself before doing anything unless told not to. tests.yml
    # already sets both variables and a bound for exactly that reason (a
    # `brew style` hung for 45 minutes on 2026-08-11 with neither). The audit
    # is measured at 25 to 96 seconds on the macOS runner that runs the same
    # command, with one outlier at 246. Ten minutes is above that worst honest
    # run and far below the six-hour default. The Linux audit has not been
    # timed yet, on its own or in the single job this used to be, and this
    # bound is the one it has to fit under.
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    # The job runs on every run, and its steps only when something changed,
    # so that `commit` can depend on it with the default rule: it runs only
    # when this job succeeded. A skipped job would skip `commit`, and with it
    # the hourly mint that proves the credential still works.
    steps:
      - if: needs.render.outputs.changed == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the rendered formulae
        if: needs.render.outputs.changed == '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-formulae
          path: ${{ runner.temp }}/rendered

      # What is audited has to be what is committed, so the downloaded files
      # are checked against the render job's digests and only then put in
      # place of the checkout's Formula/.
      - name: Put the rendered bytes in the workspace
        if: needs.render.outputs.changed == '1'
        env:
          RENDERED_DIGESTS: ${{ needs.render.outputs.digests }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected.sha256"
          printf '%s' "$RENDERED_DIGESTS" | base64 -d > "$expected"
          bash ./scripts/artifacts/formulae-digests.sh place "$RUNNER_TEMP/rendered" . "$expected"

      - name: Validate the re-rendered formulae
        if: needs.render.outputs.changed == '1'
        run: |
          set -euo pipefail
          # Run BEFORE the commit lands. A malformed render must never reach
          # `main`: here the commit is the published artifact, with no PR review
          # between it and `brew install`. `brew style` (rubocop) catches
          # formatting and deprecated-API issues, and a failure here stops the
          # commit job, which needs this one.
          #
          # `brew style` was half of the gate of tests.yml and audit.yml, not all
          # of it: `brew audit --strict` ran in audit.yml on the push that
          # followed the commit, so the rule of admission was checked against a
          # formula `brew install` could already read. The audit runs here now,
          # before the commit, and a failure here stops the commit.
          #
          # The macOS spec is still covered there, on the push and on the daily
          # cron. This job audits the active spec, which on this Linux runner
          # is the `on_linux` one, so the formula's `on_macos` block stays
          # unevaluated here. `brew audit` can audit another operating system
          # with `--os=`, but this job's Homebrew is frozen by
          # HOMEBREW_NO_AUTO_UPDATE, and a flag this job cannot prove it
          # carries is not a flag this job may depend on.
          #
          # Refuse to commit an empty tap. The guard below fires before brew is
          # set up, which is the only thing that makes it a guard at all: with
          # `shopt -s nullglob` active, an unmatched `Formula/*.rb` resolves
          # to nothing and `brew style` errors on the missing path rather than
          # treating the empty list as fine. Either change silently turns this
          # guard off, and the resulting commit lands on `main` with no pull
          # request between it and `brew install`. Glyndor/scoop-bucket has the
          # same shape; matching it is matching a guard that exists, not a
          # separate one to copy.
          shopt -s nullglob
          formulae=(Formula/*.rb)
          if [ ${#formulae[@]} -eq 0 ]; then
            echo "::error::no formulae found under Formula/; refusing to commit an empty tap"
            exit 1
          fi

          # Set brew up only once the inputs are known good: checking them needs
          # no brew, and failing before installing a toolchain is both faster and
          # the only way this guard can be exercised outside a runner.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew style "${formulae[@]}"

          # `brew audit` loads a formula through a tap Homebrew has to be told
          # to trust, and it only accepts a tap it knows about: a tap is a
          # checkout under Library/Taps. Linking the workspace in is what makes
          # the re-rendered formulae the ones audited; `brew tap glyndor/tap`
          # would fetch the published main branch instead and pass while the
          # render about to be committed is broken. Same tap, same place, same
          # order as audit.yml.
          tap_dir="$(brew --repository)/Library/Taps/glyndor/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

          # The trust comes after the link, because the tap does not exist for
          # brew before then, and Homebrew refuses to load a formula from a tap
          # it was not told to trust ("Refusing to load formula
          # glyndor/tap/podup from untrusted tap"). The linked workspace is the
          # tree about to be committed, so trusting it here widens nothing.
          brew trust glyndor/tap

          # Name every formula explicitly instead of passing `--tap`. Selecting
          # by tap means a link that silently resolved to nothing audits an
          # empty set and still exits 0: a green gate that checked no formula,
          # the same failure as a required check no job emits. The list comes
          # from the array the empty-tap guard above already proved non-empty.
          names=()
          for formula in "${formulae[@]}"; do
            names+=("glyndor/tap/$(basename "$formula" .rb)")
          done
          echo "auditing: ${names[*]}"

          # No `--online`: the URL and homepage reachability checks would make
          # this gate depend on the network and on GitHub's release endpoints,
          # and a formula must not go red because a host blipped. The signed
          # SHA256SUMS the generator verifies is what proves the assets, not a
          # HEAD request from CI.
          brew audit --strict "${names[@]}"

  commit:
    name: Commit
    # Both, and with the default rule: this job runs only when the render and
    # the validation succeeded. It carries no `if:` of its own, because any
    # status function there (`always()`, `!cancelled()`) would let it run
    # after a failed validation.
    needs: [render, validate]
    # The image is named, as everywhere else: a new one arrives as a commit.
    runs-on: ubuntu-26.04
    # contents:read is enough for GITHUB_TOKEN: the write goes through the
    # updater app's token, minted below.
    permissions:
      contents: read
    # A checkout, a download, two checks with no toolchain and two API calls.
    # The whole single job this replaced took 15 to 24 seconds; this part has
    # not been timed on its own yet. Ten minutes bounds a stalled API call far
    # below the six-hour default.
    timeout-minutes: 10
    # Nothing in this job runs `brew` or installs anything, and that is the
    # rule it exists to keep: it is the only job that holds a secret. What it
    # runs is the runner image (git, gh, jq, python3), this repository's own
    # scripts from a fresh checkout, and three first-party actions pinned by
    # commit.
    steps:
      - if: needs.render.outputs.changed == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the rendered formulae
        if: needs.render.outputs.changed == '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-formulae
          path: ${{ runner.temp }}/rendered

      # The bytes committed are the bytes the render job recorded, or nothing
      # is committed. The digests come from the render job's outputs and not
      # from the artifact, which the validation job could have replaced. The
      # roster check runs again on the placed files, because it is the last
      # reader of their meaning and it costs nothing here. All of it runs
      # before the key is used, so a run that refuses its bytes never mints.
      - name: Check the rendered bytes against the render job's digests
        if: needs.render.outputs.changed == '1'
        env:
          RENDERED_DIGESTS: ${{ needs.render.outputs.digests }}
          RENDERED_HEAD: ${{ needs.render.outputs.head }}
        run: |
          set -euo pipefail
          # The commit step diffs the placed files against this checkout and
          # pins this checkout's HEAD as the parent. Against any other parent
          # than the one the render read, that diff would undo whatever landed
          # in between.
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$RENDERED_HEAD" ]; then
            echo "::error::this checkout is at ${head:-nothing}, the render read ${RENDERED_HEAD:-nothing}; refusing to commit against another parent"
            exit 1
          fi
          expected="$RUNNER_TEMP/expected.sha256"
          printf '%s' "$RENDERED_DIGESTS" | base64 -d > "$expected"
          bash ./scripts/artifacts/formulae-digests.sh place "$RUNNER_TEMP/rendered" . "$expected"
          bash ./scripts/artifacts/check-formulae.sh

      # main now has required status checks, and a direct push has none, so
      # the commit below needs a bypass actor. github-actions[bot] cannot be
      # one; a GitHub App can. glyndor-updater is that app, installed on this
      # repository with contents:write and nothing else, and its id and key
      # live in the repository's variables and secrets. The token lives for
      # this job only.
      #
      # No `if:` here on purpose. The step used to be gated on
      # `changed == '1'`, which meant a removed installation or an invalid
      # private key stayed invisible until the next run that had something
      # to publish, and the next real release was the first run to fail.
      # Mints run on every schedule instead: one extra API call, and a
      # broken credential turns into a red run the next hour instead of at
      # the next release.
      - name: Mint a token for the updater app
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          # The token is asked for with the one permission the commit needs.
          # Without this it carries whatever the installation grants, and
          # those settings live on GitHub where this tree cannot check them:
          # widening the installation for another use would widen this token
          # with no change here.
          permission-contents: write

      - name: Commit the update to main (GitHub-signed)
        if: needs.render.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Commit the re-rendered formulae onto `main` with the GraphQL
          # createCommitOnBranch mutation. That commit is signed by GitHub
          # (Verified), and the require-signed-commits rule on `main` rejects the
          # unsigned commit a plain `git commit`/`git push` would make, and this
          # needs no signing key (unlike `git commit -S`). expectedHeadOid pins
          # the parent to the HEAD we rendered from, so if main moved since
          # checkout the mutation fails cleanly instead of clobbering, and the next
          # scheduled run re-renders from the new HEAD. Modified files go in
          # fileChanges.additions (base64), removed ones in deletions.
          head="$(git rev-parse HEAD)"
          # Merge tracked modifications and untracked additions into the same
          # additions list. Untracked files are invisible to `git diff`, which
          # is why the first formula of a newly added product was never
          # committed. Deletions stay separate: an untracked path can never be
          # a deletion, so the existing `--diff-filter=D` derivation is
          # correct as-is.
          # NUL-separated and unquoted: without -z and core.quotePath=off git
          # prints a non-ASCII path as "Formula/caf\303\251.rb" in quotes, which
          # is not a file, and the base64 of it used to be swallowed inside the
          # --arg below and committed as an empty file. The contents are read
          # into a variable first so that a failure stops the step.
          adds="$( { git -c core.quotePath=off diff -z --name-only --diff-filter=ACMR -- Formula
                    git -c core.quotePath=off ls-files -z -o --exclude-standard -- Formula; } | while IFS= read -r -d '' f; do
            contents="$(base64 -w0 "$f")" || { echo "::error::cannot read $f" >&2; exit 1; }
            jq -cn --arg path "$f" --arg contents "$contents" '{path:$path, contents:$contents}'
          done | jq -cs '.')"
          dels="$(git -c core.quotePath=off diff -z --name-only --diff-filter=D -- Formula | while IFS= read -r -d '' f; do
            jq -cn --arg path "$f" '{path:$path}'
          done | jq -cs '.')"
          gh_api_query=$(jq -n \
            --arg repo "$REPO" --arg branch "main" --arg head "$head" \
            --arg msg "chore: update formulae from the latest signed releases" \
            --argjson adds "$adds" --argjson dels "$dels" \
            '{query:"mutation($repo:String!,$branch:String!,$head:GitObjectID!,$msg:String!,$changes:FileChanges!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},expectedHeadOid:$head,message:{headline:$msg},fileChanges:$changes}){commit{oid}}}",
              variables:{repo:$repo,branch:$branch,head:$head,msg:$msg,changes:{additions:$adds,deletions:$dels}}}' \
          )
          # This runs as the updater app's installation token, minted in the
          # step above, so the ruleset's bypass for that app applies and the
          # commit is authored by glyndor-updater[bot], which dco-on-main.yml
          # exempts by pusher. The GraphQL mutation is what makes the commit
          # GitHub-signed, which
          # is what `main`'s require-signed-commits rule accepts without any
          # signing key being stored in this repository. Do not swap it for a
          # plain `git push`: that commit would be unsigned and the ruleset
          # would refuse it, which stops the channel publishing.
          echo "$gh_api_query" | gh api graphql --input - >/dev/null
          echo "Committed the formula update to main."

      - name: Fail if any product was skipped
        if: needs.render.outputs.partial == '1'
        run: |
          # Last, on purpose: the products that did render are already committed
          # by now, so a broken release in one product costs that product's
          # update and nothing else. This step is what keeps the skip from being
          # silent: the render step's annotations name which products and why.
          echo "::error::the render skipped at least one product; see the annotations on the render step"
          exit 1
