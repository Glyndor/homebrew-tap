name: Freshness

# Watchers for things whose failure mode is silence.
#
# A cron that stops firing emits nothing, and "no alert" is indistinguishable
# from "all clear". Every scheduled workflow in this org went dark on
# 2026-06-29 and four repositories stayed dark for another four weeks, all
# reporting `active` throughout. These turn the ABSENCE of a scheduled run into
# a red check on ordinary work, which is the only place anyone would see it.
#
# dependabot-freshness watches the same shape from the other side: a
# dependabot.yml in the repository is not proof Dependabot is running.
#
# Separate from the suite on purpose. These fail because something did not
# happen elsewhere, never because this pull request is wrong.
#
# So: a pull request, path-filtered, and a `schedule`. A watcher that fires only on
# a cron shares the failure mode it exists to catch, which is why the pull request
# carries it; but a repository that goes quiet stops checking its own freshness, and
# that is real here, because update.yml commits straight to `main`, so `main` moves
# with nobody opening a pull request. The cron covers exactly that stretch. There is
# no `push` trigger: see the comment on the triggers below.
#
# None of these jobs may become a required check. They report on a cron that
# stopped firing somewhere else, so a red one says nothing about the change
# under review, and requiring it would hold every pull request hostage to an
# outage its author cannot reach.

on:
  # A watcher with no schedule only watches while somebody is already looking.
  # Until this was added, these checks fired on pull_request and push and
  # nothing else, so a cron that stopped firing between two pull requests
  # would have gone unreported until a person next visited the repository.
  # The freshness thresholds below are measured in days; a watcher
  # that runs only when a person happens to push cannot honour a one-day one.
  #
  # Twice a day rather than daily, because the tightest threshold declared
  # below is two days and a daily run leaves no margin: a single skipped firing
  # (GitHub drops scheduled runs under load, and delays them by up to an hour
  # routinely) would put the check past its own limit before it ever ran.
  #
  # 08:13 and 20:13 rather than on the hour: GitHub queues everyone's :00 and
  # :30 crons together, and the other schedules in this repository already sit
  # there. The morning run is deliberately after the daily publish and update
  # windows, so a successful run of the workflow it watches is already on
  # record by the time it looks.
  schedule:
    - cron: "13 8,20 * * *"
  # A pull request runs these only when it changes what these jobs are made of:
  # this file, the two reusables it calls, the script its suite job runs and
  # the one its tool-versions job runs.
  # Anything else cannot change the
  # verdict, so it would only repeat the same verdicts. None of the jobs here is a
  # required check, which is what makes a path filter safe: a required check
  # behind a filter would never be reported and the pull request would wait for
  # ever. They measure main and crons elsewhere, never the change in the pull
  # request, so the run was created when the pull request opened and finished
  # long after its answer had stopped mattering.
  pull_request:
    paths:
      - .github/workflows/freshness.yml
      - .github/workflows/reusable-dependabot-freshness.yml
      - .github/workflows/reusable-schedule-freshness.yml
      - scripts/monitoring/check-main-ruleset.sh
      - scripts/monitoring/main-ruleset.expected.json
      - scripts/monitoring/check-tool-versions.sh
  # No `push` to main: what lands there came through a pull request that this workflow
  # judged, on the tree that lands, because the ruleset requires the branch up to date and
  # the checks that judge the pull request. One actor bypasses it, the app that regenerates
  # the formulae and pushes them with no pull request; that path is judged by update.yml
  # before it pushes and by generated-on-main.yml and audit.yml after. freshness.yml reads
  # the ruleset and compares it with the copy in the repository.
  # tests/ci/policy/workflows/repo/push-runs-only-what-main-owns.test.sh holds the list of the
  # workflows that do run on a push, with the reason of each.

permissions:
  contents: read

jobs:
  # Over the limit, the silence is an alarm only when something was behind: the
  # reusable compares the pinned actions and the pinned pip requirements the
  # dependabot.yml of this repository names with their newest release.
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  freshness-update:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: update.yml
      # update.yml asks for an hourly cron, so a limit in days would let
      # dozens of missed runs pass in silence. 24 hours comes from the last
      # 300 scheduled runs of update.yml in each channel, measured on
      # 2026-11-20 over 65.8 days: GitHub fired the cron 4.6 times a day,
      # the median gap between two successes was 5.18 hours and the longest
      # was 14.9 hours in the tap and 10.7 in the bucket. 24 hours clears
      # the longest gap measured with room left, and still turns red the day
      # the updates stop rather than three days later.
      max-age-hours: 24

  # The watcher watches itself, and this is the last link rather than a joke.
  #
  # These checks exist to catch a scheduled workflow that stopped firing. Until
  # 2026-08-29 this file had no schedule of its own, so it ran only when somebody
  # pushed; that is fixed. What the fix leaves is one level up: it now has a
  # cron, and nothing watches whether that cron keeps firing. Its silence would
  # read exactly like the silence it exists to break.
  #
  # Deliberately not added in the same change as the schedule.
  # reusable-schedule-freshness fails when no successful scheduled run exists
  # for the workflow it names, and on the day the cron landed there was none, so
  # this would have opened red for a reason that is not a fault. There are now
  # two on record, measured before adding it.
  #
  # Two days rather than one, because the cron runs twice daily and GitHub is
  # late: measured on the first two firings, the 20:13Z slot ran at 22:39Z and
  # the 08:13Z slot at 13:48Z, so delays of two to five and a half hours are
  # ordinary. A one-day threshold on a twice-daily job would sit close enough to
  # its own limit to trip on lateness rather than on failure.
  #
  # count-any-conclusion, because this job watches the workflow it is part
  # of. With the success-only query, one stretch without a successful
  # scheduled run (a paused cron, or another job here staying red) made this
  # job fail every run after that, and a failed run never becomes the success
  # the next query looks for: the alarm re-armed itself with the cron alive,
  # and toggling the workflow could not clear it. What this job can honestly
  # measure about itself is whether the cron fires; the jobs above report the
  # faults.
  freshness-itself:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: freshness.yml
      max-age-days: 2
      count-any-conclusion: true

  # HOW THE LIMIT OF A DAILY OR WEEKLY CRON IS CHOSEN
  #
  # Two periods plus one day: three days for a daily cron, fifteen for a
  # weekly one, the rule reusable-schedule-freshness.yml states for its
  # max-age-days input. One dropped firing passes and a second does not, and
  # the extra day absorbs GitHub starting a schedule hours late, which is the
  # ordinary case here (measured lateness of three to six hours below). Every
  # daily and weekly watcher in this file uses it, so two crons of the same
  # cadence cannot be held to limits that differ for no written reason.
  # A cron that fires more than once a day keeps a limit of its own instead,
  # because the cadence GitHub delivers is far from the one it asks for.
  #
  # Nothing watched drift.yml's cron, and that cron is the only thing that runs
  # the comparison at all: the file triggers on schedule and workflow_dispatch
  # and on nothing else, because pull_request would deadlock the three channels
  # and push to main reads the siblings from a CDN that serves the previous
  # file for minutes after a merge. A cron that quietly stops therefore stops
  # the whole check, and reports nothing while doing it.
  #
  # Three days, by the rule above for a daily cron. The schedule asks for
  # 09:41Z and the last five firings began between 13:00Z and 13:50Z, so a
  # delay of three to four hours is the normal case, which the day of margin
  # covers.
  freshness-drift:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: drift.yml
      max-age-days: 3

  # audit.yml gained a daily cron in #148. It checks the published formulae
  # against Homebrew's external rules even without a repository change, so its
  # schedule needs watching independently of push runs. Update commits now use
  # the updater app and trigger those push runs too.
  #
  # Added after the cron rather than with it, the same order freshness-itself
  # took and for the same reason: reusable-schedule-freshness fails when the
  # workflow it names has no successful scheduled run, so a watcher added on
  # the day the cron landed opens red for a reason that is not a fault.
  #
  # Three days, by the rule above for a daily cron. It used to be two while
  # drift.yml, daily too, had three, with nothing written to say why the two
  # differed. The cron asks for 09:19Z; the first ran 2026-09-07 at 15:05Z and
  # the second 2026-09-08 at 13:40Z, so it arrived 5h46m and 4h21m late, which
  # the day of margin covers.
  freshness-audit:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: audit.yml
      max-age-days: 3

  # The install of the formula from the tap runs weekly and when a formula changes; a cron that stops firing would
  # leave a tap nobody installs from. Weekly, so fifteen days, by the rule above.
  freshness-install:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: install-from-the-tap.yml
      max-age-days: 15

  # The bytes behind the formulae are read daily and when a formula is pushed; a cron that stops firing would leave
  # a digest nobody compares. Daily, so three days, by the rule above.
  freshness-published-bytes:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: published-bytes.yml
      max-age-days: 3

  # mutation.yml runs the catalogue every Monday and on demand, never on a
  # pull request, so its cron is the only thing that asks whether the guards
  # still die under their mutations. A cron that stops takes that question
  # with it, and nothing says so.
  #
  # Fifteen days, by the rule above for a weekly cron. The cron landed on
  # 2026-11-16 and had not fired when this job was added; the reusable gives a
  # workflow with no scheduled run on record a grace period of the same fifteen
  # days from the commit that added its file, and passes with a notice until
  # then, so the watcher is not born red and still fails if the first Monday
  # never comes.
  freshness-mutation:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: mutation.yml
      max-age-days: 15

  # What lets CI skip the suites on a push to main is the ruleset: the branch has to be up to
  # date, the aggregator and the checks that judge a pull request are required, and nobody
  # bypasses, so the tree that lands is the tree a pull request tested. This reads what is in
  # force on main and compares it with the copy in the repository, and a scheduled run that
  # finds a difference opens an issue.
  ruleset:
    concurrency:
      group: freshness-ruleset-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: the ruleset of main is the one CI relies on
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the ruleset of main with the copy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bash ./scripts/monitoring/check-main-ruleset.sh

  # The guard of each push does not run on a push that says [skip ci], or when its workflow is disabled, and then nobody
  # is told. This looks, from here, at the commits of main since the guard existed and asks GitHub whether the guard ran on
  # each and passed. It is written in this file and calls nothing of the tree, because the updater app cannot change a
  # workflow and can change a script: a push cannot change its own watcher. It is a job of its own, with no checkout and no
  # step that runs anything of the repository, on a runner that nothing else has used: a step that shares a job with one that
  # runs the code of the repository can have its PATH or its environment rewritten by it (GITHUB_PATH, GITHUB_ENV), and
  # `if: always()` does not undo that.
  #
  # The commits to read are the ones down to a stop: the commit that introduced the workflow of the guard, which GitHub names
  # from the history of that file (not a date, which the author of a commit writes), or, once a commit of main has been
  # recorded here in VERIFIED_FROM, that one. The commits are read from the head of main in pages of a hundred, as many pages
  # as MAX_PAGES says, and a scan that does not reach the stop fails: a page that is full is not a success. When it fails for
  # that reason, the way out is a pull request that writes in VERIFIED_FROM a commit that every later commit was checked against.
  guard-ran:
    concurrency:
      group: freshness-guard-ran-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: the guard of every push ran on each commit of main
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read # the runs of the guard on each commit
      issues: write # a scheduled run opens one issue for each commit that nobody judged
    steps:
      - name: Check that the guard of every push ran on each commit of main since its stop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          GUARD_JOB: every commit pushed to main is a pull request or only what the updater writes
          VERIFIED_FROM: ""
          MAX_PAGES: "5"
        run: |
          set -euo pipefail
          fail=0
          report() { # <title> <body>
            echo "::error::$2"
            fail=1
            if [ "$EVENT" = schedule ]; then
              open="$(gh issue list -R "$REPO" --state open --author app/github-actions --limit 100 --json title --jq "[.[] | select(.title == \"$1\")] | length")"
              [ "$open" != 0 ] || gh issue create -R "$REPO" --title "$1" --label "type:bug" --label "prio:P1" --body "A scheduled run reports: $2" >/dev/null
            fi
          }
          [[ "$MAX_PAGES" =~ ^[1-9][0-9]*$ ]] || { echo "::error::MAX_PAGES is '$MAX_PAGES', not a whole number above zero"; exit 1; }
          if [ -n "$VERIFIED_FROM" ]; then
            [[ "$VERIFIED_FROM" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::VERIFIED_FROM is '$VERIFIED_FROM', not a commit hash"; exit 1; }
            cutoff="$VERIFIED_FROM"
          else
            # The oldest commit of main that touched the workflow of the guard. A list that is not a list, or that fills
            # its page (so the oldest may be on the next), is an error; an empty one means the guard has not reached main
            # yet, so no commit of main has been pushed under it.
            history="$(gh api "repos/${REPO}/commits?sha=main&path=.github/workflows/pushes-to-main.yml&per_page=100")" || history=""
            cutoff="$(printf '%s' "$history" | jq -r 'if type == "array" and length < 100 then (.[-1].sha // "none") else empty end' 2>/dev/null)" || cutoff=""
            if [ "$cutoff" = none ]; then
              # An empty history is only the guard not having reached main while its file is not on main. If the file
              # is there and its history is empty (a path that moved, an answer that is not what it should be) the
              # commits cannot be told apart, and that is a failure.
              if probe="$(gh api "repos/${REPO}/contents/.github/workflows/pushes-to-main.yml?ref=main" --jq '.type' 2>&1)"; then
                echo "::error::the workflow of the guard of every push is on main and its history is empty, so the commit that introduced it cannot be found"
                exit 1
              fi
              case "$probe" in
                *"HTTP 404"*) echo "The guard of every push has not reached main yet, so no commit of main has been pushed under it."; exit 0 ;;
                *) echo "::error::whether the workflow of the guard of every push is on main cannot be read"; exit 1 ;;
              esac
            fi
            [[ "$cutoff" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit that introduced the guard of every push cannot be found, so the commits before it cannot be told from the ones it should have judged"; exit 1; }
          fi
          shas=""
          found=0
          for page in $(seq 1 "$MAX_PAGES"); do
            list="$(gh api "repos/${REPO}/commits?sha=main&per_page=100&page=${page}")" || list=""
            chunk="$(printf '%s' "$list" | jq -r --arg stop "$cutoff" '
              if type == "array" and length > 0 and length <= 100 and all(.[]; (.sha | test("^[0-9a-f]{40}$")) and ((.parents | length) >= 1))
              then ([.[].sha] | index($stop)) as $i
                | if $i != null then "found", .[:$i + 1][].sha elif length == 100 then "more", .[].sha else "end", .[].sha end
              else empty end')" || chunk=""
            status="${chunk%%$'\n'*}"
            case "$status" in found | more | end) ;; *) echo "::error::the commits of main cannot be read whole, so whether the guard ran on them is not known"; exit 1 ;; esac
            shas="$shas"$'\n'"$(printf '%s\n' "$chunk" | tail -n +2)"
            if [ "$status" = found ]; then found=1; break; fi
            [ "$status" = more ] || break
          done
          [ "$found" = 1 ] || { echo "::error::the commits of main were read from its head, ${MAX_PAGES} page(s) of a hundred at the most, and the commit the scan stops at (${cutoff:0:7}) was not among them, so whether the guard ran on every commit in between is not known; write in VERIFIED_FROM a commit that every later commit was checked against"; exit 1; }
          for sha in $(printf '%s\n' "$shas" | sed '/^$/d'); do
            enc="$(jq -rn --arg n "$GUARD_JOB" '$n | @uri')"
            runs="$(gh api "repos/${REPO}/commits/${sha}/check-runs?check_name=${enc}&filter=all&per_page=100")"
            if ! printf '%s' "$runs" | jq -e '(.check_runs | type) == "array" and (.total_count | type) == "number" and (.check_runs | length) == .total_count
                and ([.check_runs[] | select(.app.id == 15368)] | length > 0 and all(.[]; .conclusion == "success"))' >/dev/null; then
              report "main commit ${sha:0:7} was not judged" "main commit $sha has no run of the guard of every push, from GitHub Actions, that passed: it was pushed with [skip ci], or its workflow was disabled, or the guard failed on it"
            fi
          done
          [ "$fail" = 0 ] || exit 1

  tool-versions:
    name: pinned tool versions keep up with upstream
    # A newer push to the same pull request supersedes the run; on main and on
    # the schedule every run is kept, as each answers for its own commit.
    concurrency:
      group: freshness-tool-versions-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The image is named, as everywhere else: a new one arrives as a commit.
    runs-on: ubuntu-26.04
    # Two `gh release list` calls and a checkout, seconds when measured
    # locally against stubs; the real calls are two API requests. Ten minutes
    # is the floor this repository uses for a job whose honest run is seconds.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pinned tool versions with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./scripts/monitoring/check-tool-versions.sh
