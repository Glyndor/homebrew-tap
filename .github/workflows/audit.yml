name: Audit

# `brew audit` runs Homebrew's own rules against the rendered formulae. It is
# separate from tests.yml because it checks the OUTPUT against an external
# standard rather than this repository's logic against its own: a red here
# usually means Homebrew changed what it accepts, not that the generator broke.
#
# Job id unchanged. A required status check is named
# `<caller job id> / <inner job name>` and the file is not part of that name.

on:
  # The schedule checks published formulae against changes in Homebrew's rules
  # even when this repository has not changed. App-authenticated update commits
  # also trigger the push run.
  #
  # Historical measurement, 2026-09-06: updates then used GITHUB_TOKEN, whose
  # events did not trigger workflows. Formula/podup.rb changed on September
  # 3, 4 and 5 with no push run since September 2.
  #
  # That is how #146 sat for three days. `brew audit` had started refusing the
  # declared version as redundant with the one it scans from the url, every
  # formula was failing, and the first person to see it was whoever next
  # opened a pull request.
  #
  # Daily rather than hourly: what changes underneath is Homebrew's own rules,
  # not this repository, and the job runs on a macOS runner, which bills at ten
  # times a Linux minute. 09:19Z is off the hour and the half hour, where
  # GitHub queues everyone's crons, and after the 08:13Z freshness slot and the
  # hourly update, so a scheduled run reads a `main` that already carries the
  # morning's render.
  #
  # freshness.yml watches this cron (freshness-audit), so a scheduled run
  # that stops firing turns that workflow red.
  schedule:
    - cron: "19 9 * * *"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the audit still running on the old
# commit, and that audit is a macOS minute at ten times the Linux price. Only
# pull requests cancel: a run on `main` is the one freshness reads, and a
# cancelled one would leave it with nothing to read.
concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    # Only checkout and a local diff; 2 minutes bounds runner/setup stalls.
    # No hosted measurement yet; the decision itself is exercised by audit-scope.test.sh.
    timeout-minutes: 2
    outputs:
      run_audit: ${{ steps.scope.outputs.run_audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the audit inputs changed
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          run_audit=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed="$(mktemp)"
            trap 'rm -f "$changed"' EXIT
            # HEAD is the PR merge commit; its first parent is the base tree.
            # Disable rename detection so both old and new paths are checked.
            # A failed or empty diff cannot justify skipping a required check.
            if git diff --no-renames --name-only -z HEAD^1..HEAD -- > "$changed" && [ -s "$changed" ]; then
              run_audit=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  Formula/*|.github/workflows/audit.yml) run_audit=true; break ;;
                esac
              done < "$changed"
            fi
          fi
          echo "run_audit=$run_audit" >> "$GITHUB_OUTPUT"

  audit:
    needs: scope
    # A skipped required job reports Success. That is intentional when the PR
    # changed no formula or audit logic: Homebrew rule changes are covered by
    # the daily cron. The audit reads no repository scripts, so scripts/** is
    # deliberately absent from the allowlist above. Push/schedule always run.
    # always(): if the scope job itself fails, the audit runs instead of being
    # skipped, because a skipped required check reports Success.
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.run_audit == 'true')
    name: brew audit
    runs-on: macos-latest
    # The variables below stop brew updating itself; this bounds what is left.
    # Measured over the last eight runs: 25 to 96 seconds, one outlier at 246
    # seconds. Thirty minutes is above ten times the outlier and well under the
    # six-hour default, which on a macOS runner costs ten times a Linux minute.
    timeout-minutes: 30
    env:
      # Keep the run deterministic and offline: no auto-update mid-job, and no
      # analytics ping (the org ships and runs nothing that phones home).
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit formulae as an installed tap
        run: |
          set -euo pipefail
          # `brew audit --tap` only accepts a tap Homebrew knows about, and a tap
          # is just a checkout in the right place under Library/Taps. Linking the
          # workspace in is what makes the PR's own formulae the ones audited;
          # `brew tap glyndor/tap` would fetch the published main branch instead
          # and pass while the change under review is broken.
          tap_dir="$(brew --repository)/Library/Taps/glyndor/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

          # Homebrew now refuses to load a formula from a tap it was not told to
          # trust ("Refusing to load formula glyndor/tap/podup from untrusted
          # tap"), which turned this job red on main on 2026-10-30 with no change
          # to the tap. The linked workspace is the repository under review, so
          # trusting it here widens nothing. It has to come after the link: the
          # tap does not exist for brew before then.
          brew trust glyndor/tap

          # Name every formula explicitly instead of passing `--tap`. Selecting
          # by tap means a link that silently resolved to nothing audits an
          # empty set and still exits 0: a green gate that checked no formula,
          # the same failure as a required check no job emits. Named formulae
          # make that case fail loudly with "No available formula".
          shopt -s nullglob
          names=()
          for formula in Formula/*.rb; do
            names+=("glyndor/tap/$(basename "$formula" .rb)")
          done
          if [ ${#names[@]} -eq 0 ]; then
            echo "::error::no formulae found under Formula/; the tap is empty or the checkout is wrong"
            exit 1
          fi
          echo "auditing: ${names[*]}"

          # No `--online`: the URL and homepage reachability checks would make
          # this gate depend on the network and on GitHub's release endpoints,
          # and a formula must not go red because a host blipped. The signed
          # SHA256SUMS the generator verifies is what proves the assets, not a
          # HEAD request from CI.
          brew audit --strict "${names[@]}"
