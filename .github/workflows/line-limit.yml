name: Line limit

# Enforces the org file-size standard (soft 300 / hard 500 code lines) via the
# repository-local reusable. Keep its policy aligned with the sibling channels.

on:
  pull_request:
  # No `push` to main: what lands there came through a pull request that this workflow
  # judged, on the tree that lands, because the ruleset requires the branch up to date and
  # the checks that judge the pull request. One actor bypasses it, the app that regenerates
  # the formulae and pushes them with no pull request; that path is judged by update.yml
  # before it pushes and by generated-on-main.yml and audit.yml after. freshness.yml reads
  # the ruleset and compares it with the copy in the repository.
  # tests/ci/policy/workflows/push-runs-only-what-main-owns.test.sh holds the list of the
  # workflows that do run on a push, with the reason of each.

permissions:
  contents: read

jobs:
  line-limit:
    uses: ./.github/workflows/reusable-line-limit.yml
    with:
      # The reusable's default extension list has no `yml`, so the workflows --
      # by some way the longest files here -- were never counted. Its counter
      # was always ready for them: the awk that strips comments already treats
      # `.yml` as a hash-comment language. Only the list of extensions to open
      # left them out.
      #
      # Passed from the caller rather than changed in the reusable's default,
      # so this repository's choice stays visible in this repository's own file
      # and the reusable stays a recognisable copy of the shared one.
      #
      # Nothing needed splitting to turn this on. Counted the way the check
      # counts -- comments and blank lines dropped -- the longest YAML in the
      # repository is 267 lines (.github/workflows/update.yml) against a soft limit of 300.
      #
      # `txt` is there for the lists and maps the tools read. The largest file
      # no gate opened was scripts/quality/scope/suite-scope.txt, the map that
      # decides which suites a pull request runs, because no extension in the
      # list named it. The counter reads `#` as a comment in a `.txt`, as those
      # files use it. Counted that way every one of them is under the hard
      # limit of 500, and the check says so on each run.
      extensions: "rs go ts tsx js jsx mjs cjs py sh astro vue svelte yml yaml txt"
