name: DCO on main

# Detection, not prevention, and the difference is the whole point of this file.
#
# Human pull requests must pass the required DCO check. The updater GitHub App
# bypasses required checks for generated commits; humans have no bypass under
# the documented ruleset. This push watcher reports any unsigned human commit
# that nevertheless reaches main, after publication rather than before it.
#
# Commits pushed by github-actions[bot] or by glyndor-updater[bot], the app
# update.yml commits through, are exempt, and that is not a loophole.
# DCO is a person's attestation about their right to submit code. A bot
# regenerating a formula from an already-verified release is not contributing in
# that sense, and emitting a trailer on its behalf would manufacture an
# attestation nobody made -- which is worse than its absence, and was rejected
# when it was proposed. Exempting the bot scopes the rule to who it applies to;
# it does not fake compliance.
#
# Push to main only, which is the only place its question exists: it reports a
# human-authored commit that arrived without a sign-off. It gates nothing. By
# the time it speaks the commit is on the branch users install from, so what it
# produces is a report, not a refusal.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco-on-main:
    name: every human commit on main is signed off
    runs-on: ubuntu-latest
    # Measured 8 to 10 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          # From GitHub's event payload, not from any git config.
          PUSHER: ${{ github.event.pusher.name }}
        run: |
          set -euo pipefail
          ./scripts/governance/check-dco-on-main.sh "$BEFORE" "$AFTER" "$PUSHER"
