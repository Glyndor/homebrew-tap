name: Tests

# The shell lint, this repository's own suite, and the two checks that read the
# generated tree: that PRODUCTS and Formula/ still agree, and that the
# formulae pass `brew style`.
#
# Split out of the former ci.yml, which carried the suite, pull request hygiene,
# `brew audit` and two freshness watchers in one file. They fail for different
# reasons and are read by different people.
#
# Job ids are unchanged. A required status check is named
# `<caller job id> / <inner job name>` and the FILE is not part of that name, so
# moving a job to another workflow leaves its check name alone. Renaming one is
# a ruleset change, not tidying.
#
# The suite is listed one per line. As a single line it outgrew any terminal,
# which is how a suite went missing from apt's without anyone noticing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The first item is the runner and the rest are its arguments. A `&&` chain
# cannot tell a suite that ran every assertion from one that exited early
# having run three: both leave a zero status and the chain moves on. Every
# test file now ends by printing a sentinel after its last assertion, and
# tests/ci/suites/check-suite-completeness.test.sh requires one from every file it was
# given, naming the file that did not produce one.
#

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      # No path is listed, so nothing is ever skipped. The suite reads every
      # document under docs/ through scripts/quality/check-doc-anchors.sh, so a
      # pull request that touches nothing but prose is exactly the one that can
      # break a reference; README.md is read by check-issue-templates for
      # the same reason. tests/ci/suites/shell-ci-scope.test.sh fails if this
      # list grows to a file the suite reads.
      test-command: >-
        ./tests/ci/suites/check-suite-completeness.test.sh
        ./tests/release/render-formulae.test.sh
        ./tests/release/render-formulae/render-formulae-trust.test.sh
        ./tests/release/render-formulae/render-formulae-transfer-limits.test.sh
        ./tests/release/render-formulae/render-formulae-version.test.sh
        ./tests/release/render-formulae/render-formulae-products.test.sh
        ./tests/release/render-formulae/render-formulae-attestation.test.sh
        ./tests/release/render-formulae/render-formulae-inputs.test.sh
        ./tests/release/render-formulae/render-formulae-tag-shape.test.sh
        ./tests/release/render-formulae/render-formulae-symlink.test.sh
        ./tests/publication/update/update-workflow.test.sh
        ./tests/artifacts/check-products-consistent.test.sh
        ./tests/artifacts/check-formulae.test.sh
        ./tests/artifacts/check-formulae/check-formulae-roster.test.sh
        ./tests/artifacts/check-version-monotonic.test.sh
        ./tests/ci/policy/rules/locale-pinned.test.sh
        ./tests/quality/check-test-coverage.test.sh
        ./tests/quality/check-action-pins.test.sh
        ./tests/quality/check-doc-anchors.test.sh
        ./tests/governance/check-dco-on-main.test.sh
        ./tests/governance/check-issue-templates.test.sh
        ./tests/ci/suites/ci-runs-every-test.test.sh
        ./tests/quality/lint-workflow-shell.test.sh
        ./tests/ci/reusable/reusable-line-limit.test.sh
        ./tests/ci/reusable/reusable-shell-ci.test.sh
        ./tests/ci/suites/shell-ci-scope.test.sh
        ./tests/quality/ci-job-scope.test.sh
        ./tests/ci/suites/lint-job-scope.test.sh
        ./tests/ci/policy/rules/cancel-policy.test.sh
        ./tests/ci/reusable/reusable-empty-diff.test.sh
        ./tests/ci/reusable/reusable-dco.test.sh
        ./tests/quality/check-editorconfig.test.sh
        ./tests/monitoring/check-reusable-drift.test.sh
        ./tests/monitoring/check-channel-drift.test.sh
        ./tests/monitoring/drift-watchers-transfer-cap.test.sh
        ./tests/ci/policy/workflows/workflow-shape.test.sh
        ./tests/ci/policy/workflows/workflow-publish-triggers.test.sh
        ./tests/ci/policy/workflows/freshness-pr-scope.test.sh
        ./tests/monitoring/check-render-drift.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-drift.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-missing.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-network.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-digest-case.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-version.test.sh
        ./tests/ci/reusable/reusable-dependabot-freshness.test.sh
        ./tests/ci/reusable/reusable-schedule-freshness.test.sh
        ./tests/ci/reusable/reusable-workflow-lint.test.sh
        ./tests/ci/reusable/reusable-workflow-lint-install.test.sh
        ./tests/ci/policy/rules/brew-jobs-are-bounded.test.sh
        ./tests/ci/policy/workflows/audit-scope.test.sh
        ./tests/publication/audit/audit-runs-on-a-schedule.test.sh
        ./tests/publication/audit/audit-trusts-the-linked-tap.test.sh
        ./tests/publication/update/update-audits-before-commit.test.sh
        ./tests/ci/policy/rules/jobs-are-bounded.test.sh
        ./tests/ci/policy/rules/network-calls-are-bounded.test.sh
        ./tests/monitoring/check-suite-on-main.test.sh
        ./tests/monitoring/check-suite-on-main/check-suite-on-main-push.test.sh
        ./tests/monitoring/check-suite-on-main/check-suite-on-main-retry.test.sh
        ./tests/monitoring/check-suite-on-main/check-suite-on-main-order.test.sh
        ./tests/ci/docs/documented-test-command.test.sh
      # shellcheck: tests/quality/lint-workflow-shell.test.sh plants a violation and
      # requires the linter to report it, so it needs the linter. The gate
      # itself runs in the shellcheck job against the pinned binary; this one
      # asserts behaviour, which does not turn on the exact version.
      # python3-yaml: tests/ci/policy/rules/brew-jobs-are-bounded.test.sh parses the workflows
      # rather than grepping them, so a job's env and bound are read from the
      # job they belong to. tests/ci/policy/rules/jobs-are-bounded.test.sh reads the same way
      # for the timeout-minutes rule.
      # python3-yaml also serves tests/ci/reusable/reusable-workflow-lint.test.sh, whose
      # tooling-isolation step imports it exactly as the workflow-lint job does.
      apt-packages: shellcheck python3-yaml ruby

  products:
    name: products match the generator
    runs-on: ubuntu-latest
    # Measured 3 to 6 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Formula/ must match PRODUCTS
        run: |
          set -euo pipefail
          # The check itself lives in scripts/, not here, so that it can be
          # tested. Inline in this file it was unreachable by anything but a
          # real CI run, which meant it had never been watched fail.
          # tests/artifacts/check-products-consistent.test.sh covers it.
          ./scripts/artifacts/check-products-consistent.sh

      - name: Every formula must match what the generator emits
        run: |
          set -euo pipefail
          # The CONTENT of every formula, not only its name: the repository and
          # the tag its urls name, the assets it installs, the shape of its
          # digests, and the statements it is allowed to make. `brew style` and
          # `brew audit --strict` read a formula as Ruby and as a Homebrew
          # recipe, and neither of them knows what the product's release looked
          # like, so both accept a formula that is well formed and wrong: a url
          # naming another Glyndor repository, a second tag in the same
          # formula, a `post_install` block that runs on every install. The
          # roster in scripts/release/render-formulae.sh is the only place a
          # product is declared, and this check reads it rather than keeping a
          # second list. Glyndor/scoop-bucket refuses the same shapes for its
          # manifests.
          #
          # A step here rather than a new job: a job id is part of the name of
          # a required status check, and a new one would not be required until
          # the ruleset changed. This step rides inside a check that already is.
          ./scripts/artifacts/check-formulae.sh

      - name: A formula never goes back to an older release
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The renderer refuses a rollback, a hand edit does not. The base is
          # fetched on its own: the checkout is shallow and has no history.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          ./scripts/artifacts/check-version-monotonic.sh "$BASE_SHA"

  formulae:
    name: brew style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mirror the audit job: keep the run deterministic and offline. Without
      # these, `brew style` will phone home for taps and analytics on Linux
      # runners, and a hanging auto-update can burn the whole 45-minute default
      # job budget. The timeout above bounds the worst case.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate formulae with the preinstalled Homebrew
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # `brew style` (rubocop under the hood) accepts file paths and catches
          # formatting and deprecated-API issues. It runs on Linux because it
          # parses the formula rather than resolving it, so it needs no macOS
          # runner and keeps the fast feedback on every push. The deeper
          # `brew audit --strict` resolves the active platform spec. audit.yml
          # runs it on macOS to check that branch; the formula also has an
          # `on_linux` branch.
          brew style Formula/*.rb
