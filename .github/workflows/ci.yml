name: CI

# Validates every formula on each PR and push to main, so a malformed or
# non-conforming formula fails review instead of a `brew install`. Uses the
# Homebrew that GitHub's runner images ship preinstalled, so no third-party
# setup action is needed (org actions allowlist: GitHub- and Glyndor-owned only).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fail a pull request whose diff against main is empty. Eight no-op PRs
  # landed here before this gate existed: the work was already in main via
  # squash-merge, the branch was recreated as -v2, and the second merge
  # landed as a commit with zero files changed. Pinned to the SHA that is
  # the v1.14.0 tag so this is the consumer that proves the reusable; once
  # the emitted name has stayed stable across a few weeks of green here and
  # in the other consumers, I will promote this from advisory to required
  # in the ruleset.
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: Glyndor/.github/.github/workflows/empty-diff.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1

  # Lint scripts/ the same way Glyndor/apt does. The generator verifies a
  # release signature and writes the file users install from, and the update
  # workflow commits its output straight to main, so a bug in render-formulae.sh
  # reaches users with no pull request in between. `bash -n` plus a pinned
  # shellcheck, both from the reusable.
  shell:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@3a46ffe91ecadcce7f14c99ea8b23ead4274f325 # v1.13.2
    with:
      test-command: ./tests/render-formulae.test.sh && ./tests/update-workflow.test.sh

  products:
    name: products match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The README table and Formula/ must match PRODUCTS
        run: |
          set -euo pipefail
          # scripts/render-formulae.sh's PRODUCTS table is the only place a
          # product is declared. Two things restate it and cannot be generated
          # from it: the README's "Available formulae" table, and the set of
          # files under Formula/. With one product the drift is invisible; with
          # the full roster it is certain, and it is the same rot as the CI
          # comments corrected in #11.
          declared="$(awk '/^PRODUCTS=\(/ { inside = 1; next }
                           inside && /^\)/  { exit }
                           inside           { print }' scripts/render-formulae.sh \
                     | sed -n 's/^[^"]*"[^|]*|\([^|]*\)|.*/\1/p' | sort -u)"
          [ -n "$declared" ] || { echo "::error::could not read PRODUCTS out of scripts/render-formulae.sh"; exit 1; }

          # Backticks and "$" never appear inside the single quotes below. They
          # would be awk's and Markdown's, but SC2016 reads them as shell
          # expansions and actionlint runs shellcheck over this block; a
          # file-level disable directive is not honoured there.
          documented="$(awk '/^\| Formula \| Product \|/ { inside = 1; next }
                             inside && /^\|---/ { next }
                             inside && /^\|/    { print; next }
                             inside              { exit }' README.md \
                       | cut -d'|' -f2 | tr -cd '[:alnum:]._\n-' | awk 'NF' | sort -u)"

          rendered="$(find Formula -maxdepth 1 -name '*.rb' -printf '%f\n' \
                     | while read -r f; do echo "${f%.rb}"; done | sort -u)"

          status=0
          if [ "$declared" != "$documented" ]; then
            echo "::error file=README.md::the README's Available formulae table disagrees with PRODUCTS"
            diff <(echo "$declared") <(echo "$documented") | sed 's/^/  /' || true
            status=1
          fi
          if [ "$declared" != "$rendered" ]; then
            echo "::error::Formula/ disagrees with PRODUCTS — re-run scripts/render-formulae.sh"
            diff <(echo "$declared") <(echo "$rendered") | sed 's/^/  /' || true
            status=1
          fi
          [ "$status" -eq 0 ] && echo "ok  $(echo "$declared" | tr '\n' ' ')"
          exit "$status"

  formulae:
    name: brew style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mirror the audit job: keep the run deterministic and offline. Without
      # these, `brew style` will phone home for taps and analytics on Linux
      # runners, and a hanging auto-update can burn the whole 45-minute default
      # job budget. The timeout above bounds the worst case.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate formulae with the preinstalled Homebrew
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # `brew style` (rubocop under the hood) accepts file paths and catches
          # formatting and deprecated-API issues. It runs on Linux because it
          # parses the formula rather than resolving it, so it needs no macOS
          # runner and keeps the fast feedback on every push. The deeper
          # `brew audit --strict` cannot run here — it resolves the active spec,
          # and the binaries live in an `on_macos` block a Linux runner never
          # evaluates — so it runs in the `brew audit` job below instead.
          brew style Formula/*.rb

  audit:
    name: brew audit
    runs-on: macos-latest
    env:
      # Keep the run deterministic and offline: no auto-update mid-job, and no
      # analytics ping (the org ships and runs nothing that phones home).
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit formulae as an installed tap
        run: |
          set -euo pipefail
          # `brew audit --tap` only accepts a tap Homebrew knows about, and a tap
          # is just a checkout in the right place under Library/Taps. Linking the
          # workspace in is what makes the PR's own formulae the ones audited —
          # `brew tap glyndor/tap` would fetch the published main branch instead
          # and pass while the change under review is broken.
          tap_dir="$(brew --repository)/Library/Taps/glyndor/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

          # Name every formula explicitly instead of passing `--tap`. Selecting
          # by tap means a link that silently resolved to nothing audits an
          # empty set and still exits 0 — a green gate that checked no formula,
          # the same failure as a required check no job emits. Named formulae
          # make that case fail loudly with "No available formula".
          shopt -s nullglob
          names=()
          for formula in Formula/*.rb; do
            names+=("glyndor/tap/$(basename "$formula" .rb)")
          done
          if [ ${#names[@]} -eq 0 ]; then
            echo "::error::no formulae found under Formula/ — the tap is empty or the checkout is wrong"
            exit 1
          fi
          echo "auditing: ${names[*]}"

          # No `--online`: the URL and homepage reachability checks would make
          # this gate depend on the network and on GitHub's release endpoints,
          # and a formula must not go red because a host blipped. The signed
          # SHA256SUMS the generator verifies is what proves the assets, not a
          # HEAD request from CI.
          brew audit --strict "${names[@]}"
