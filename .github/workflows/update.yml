name: update

# Keeps Formula/*.rb in sync with each product's latest signed release, the same
# pull model as Glyndor/apt: no product pushes here. This reads their public
# releases, verifies the signed SHA256SUMS against the org release key, validates
# the re-rendered formulae, and commits them straight to `main` — GitHub-signed
# via the createCommitOnBranch mutation — so a new macOS build reaches
# `brew upgrade` within a day without any product holding a credential here.
#
# Why a direct commit and not a pull request: the organisation forbids GitHub
# Actions from creating or approving PRs (a locked, org-wide setting), so the
# apt-style "open an auto-merging PR" path is unavailable. Unlike Glyndor/apt —
# whose automation never writes git, it publishes to R2 — a tap's git content
# *is* the published artifact, so the update must land as a commit. It lands on
# `main` directly, validated in this job *before* it lands (there is no PR gate
# standing between the commit and `brew install`), and signed by GitHub so
# `main`'s require-signed-commits rule accepts it without a signing key here.
#
# A schedule and a manual button, and no `pull_request` trigger, because none of
# this is about a pull request: it reads each product's latest signed release and
# re-renders the published artifact. That is also why validation runs inside the
# job before the commit, no pull request review stands between that commit and
# somebody's `brew install`.
on:
  schedule:
    # Hourly, at :30 to stay clear of the queue that forms on the hour and to
    # keep the historical offset from apt's 06:00 publish.
    #
    # Was daily. The 24-hour worst case between a product publishing and this
    # channel serving it was the cron, not the pull model: a security fix could
    # sit a day behind with the short path already built and unused.
    #
    # The push alternative was declined rather than forgotten. update.yml
    # carries a repository_dispatch trigger a product could POST to, and
    # Glyndor/podup declined to wire it on 2026-08-29 for a reason recorded in
    # `context/podup`: a push model would let a compromised release workflow
    # write into the distribution channels, and its release job already holds
    # the Ed25519 signing key and the crates.io token, so a channel-write token
    # would put signing, the registry and both channels behind one compromise.
    # Pulling more often buys most of the latency back and moves no credential.
    #
    # Cheap, measured rather than assumed: a run takes 20 to 52 seconds and
    # short-circuits when nothing changed, and the expensive macOS audit fires
    # on push rather than on this schedule, so it still runs only when a render
    # actually differs.
    - cron: "30 * * * *"
  workflow_dispatch:
  # Optional instant trigger: a product's release workflow may
  # POST /repos/Glyndor/homebrew-tap/dispatches with event_type "release".
  # Nothing is wired to it today; the daily schedule is the baseline.
  repository_dispatch:
    types: [release]

permissions:
  contents: read

# Never run two updates at once — they would race on main's HEAD (the second
# would fail its expectedHeadOid check and drop the update to the next run).
concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  update:
    name: Render, validate, and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography

      - name: Render formulae from the latest signed releases
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exit 3 means the generator skipped at least one product and rendered
          # the rest: its release was unreadable, its SHA256SUMS did not verify,
          # or an asset the table names was missing. Carry on and commit what did
          # render — holding a good update back because an unrelated product's
          # release is broken is exactly what this replaced — then fail the job in
          # the last step so the skip is loud. Any other non-zero is a failure
          # before any product was reached, and stops the run here.
          rc=0
          ./scripts/render-formulae.sh || rc=$?
          case "$rc" in
            0) echo "partial=0" >> "$GITHUB_OUTPUT" ;;
            3) echo "partial=1" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          if git diff --quiet -- Formula; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "No formula changed."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the re-rendered formulae
        if: steps.render.outputs.changed == '1'
        run: |
          set -euo pipefail
          # Run BEFORE the commit lands. A malformed render must never reach
          # `main`: here the commit is the published artifact, with no PR review
          # between it and `brew install`. `brew style` (rubocop) catches
          # formatting and deprecated-API issues.
          #
          # This is half of ci.yml's gate, not all of it. `brew audit --strict`
          # resolves the active spec, which a Linux runner leaves unevaluated
          # inside the formula's `on_macos` block, so it needs a macOS runner
          # and runs in ci.yml on the resulting push rather than here.
          # Refuse to commit an empty tap. The guard below fires before brew is
          # set up, which is the only thing that makes it a guard at all: with
          # `shopt -s nullglob` active, an unmatched `Formula/*.rb` resolves
          # to nothing and `brew style` errors on the missing path rather than
          # treating the empty list as fine. Either change silently turns this
          # guard off, and the resulting commit lands on `main` with no pull
          # request between it and `brew install`. Glyndor/scoop-bucket has the
          # same shape; matching it is matching a guard that exists, not a
          # separate one to copy.
          shopt -s nullglob
          formulae=(Formula/*.rb)
          if [ ${#formulae[@]} -eq 0 ]; then
            echo "::error::no formulae found under Formula/ — refusing to commit an empty tap"
            exit 1
          fi

          # Set brew up only once the inputs are known good: checking them needs
          # no brew, and failing before installing a toolchain is both faster and
          # the only way this guard can be exercised outside a runner.
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew style "${formulae[@]}"

      - name: Commit the update to main (GitHub-signed)
        if: steps.render.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Commit the re-rendered formulae onto `main` with the GraphQL
          # createCommitOnBranch mutation. That commit is signed by GitHub
          # (Verified) — the require-signed-commits rule on `main` rejects the
          # unsigned commit a plain `git commit`/`git push` would make, and this
          # needs no signing key (unlike `git commit -S`). expectedHeadOid pins
          # the parent to the HEAD we rendered from, so if main moved since
          # checkout the mutation fails cleanly instead of clobbering — the next
          # scheduled run re-renders from the new HEAD. Modified files go in
          # fileChanges.additions (base64), removed ones in deletions.
          head="$(git rev-parse HEAD)"
          adds="$(git diff --name-only --diff-filter=ACMR -- Formula | while read -r f; do
            jq -cn --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path:$path, contents:$contents}'
          done | jq -cs '.')"
          dels="$(git diff --name-only --diff-filter=D -- Formula | while read -r f; do
            jq -cn --arg path "$f" '{path:$path}'
          done | jq -cs '.')"
          gh_api_query=$(jq -n \
            --arg repo "$REPO" --arg branch "main" --arg head "$head" \
            --arg msg "chore: update formulae from the latest signed releases" \
            --argjson adds "$adds" --argjson dels "$dels" \
            '{query:"mutation($repo:String!,$branch:String!,$head:GitObjectID!,$msg:String!,$changes:FileChanges!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},expectedHeadOid:$head,message:{headline:$msg},fileChanges:$changes}){commit{oid}}}",
              variables:{repo:$repo,branch:$branch,head:$head,msg:$msg,changes:{additions:$adds,deletions:$dels}}}' \
          )
          # This runs as GITHUB_TOKEN, a job-scoped token on its own rate limit.
          # The GraphQL mutation is what makes the commit GitHub-signed, which
          # is what `main`'s require-signed-commits rule accepts without any
          # signing key being stored in this repository. Do not swap it for a
          # plain `git push`: that commit would be unsigned and the ruleset
          # would refuse it, which stops the channel publishing.
          echo "$gh_api_query" | gh api graphql --input - >/dev/null
          echo "Committed the formula update to main."

      - name: Fail if any product was skipped
        if: steps.render.outputs.partial == '1'
        run: |
          # Last, on purpose: the products that did render are already committed
          # by now, so a broken release in one product costs that product's
          # update and nothing else. This step is what keeps the skip from being
          # silent — the render step's annotations name which products and why.
          echo "::error::the render skipped at least one product; see the annotations on the render step"
          exit 1
