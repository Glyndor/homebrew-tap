name: Freshness

# Watchers for things whose failure mode is silence.
#
# A cron that stops firing emits nothing, and "no alert" is indistinguishable
# from "all clear". Every scheduled workflow in this org went dark on
# 2026-06-29 and four repositories stayed dark for another four weeks, all
# reporting `active` throughout. These turn the ABSENCE of a scheduled run into
# a red check on ordinary work, which is the only place anyone would see it.
#
# dependabot-freshness watches the same shape from the other side: a
# dependabot.yml in the repository is not proof Dependabot is running.
#
# Separate from the suite on purpose. These fail because something did not
# happen elsewhere, never because this pull request is wrong.
#
# So: pull request, push to main, and a `schedule` as well. A watcher that
# fires only on a cron shares the failure mode it exists to catch, which is
# why the first two triggers carry it; but a repository that goes quiet stops
# checking its own freshness, and that is real here, because update.yml
# commits straight to `main`, so `main` moves with nobody opening a pull
# request. The cron covers exactly that stretch.
#
# None of these jobs may become a required check. They report on a cron that
# stopped firing somewhere else, so a red one says nothing about the change
# under review, and requiring it would hold every pull request hostage to an
# outage its author cannot reach.

on:
  # A watcher with no schedule only watches while somebody is already looking.
  # Until this was added, these checks fired on pull_request and push and
  # nothing else, so a cron that stopped firing between two pull requests
  # would have gone unreported until a person next visited the repository.
  # The freshness thresholds below are measured in days; a watcher
  # that runs only when a person happens to push cannot honour a one-day one.
  #
  # Twice a day rather than daily, because the tightest threshold declared
  # below is one day and a daily run leaves no margin: a single skipped firing
  # (GitHub drops scheduled runs under load, and delays them by up to an hour
  # routinely) would put the check past its own limit before it ever ran.
  #
  # 08:13 and 20:13 rather than on the hour: GitHub queues everyone's :00 and
  # :30 crons together, and the other schedules in this repository already sit
  # there. The morning run is deliberately after the daily publish and update
  # windows, so a successful run of the workflow it watches is already on
  # record by the time it looks.
  schedule:
    - cron: "13 8,20 * * *"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  freshness-update:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: update.yml
      max-age-days: 3

  # The watcher watches itself, and this is the last link rather than a joke.
  #
  # These checks exist to catch a scheduled workflow that stopped firing. Until
  # 2026-08-29 this file had no schedule of its own, so it ran only when somebody
  # pushed; that is fixed. What the fix leaves is one level up: it now has a
  # cron, and nothing watches whether that cron keeps firing. Its silence would
  # read exactly like the silence it exists to break.
  #
  # Deliberately not added in the same change as the schedule.
  # reusable-schedule-freshness fails when no successful scheduled run exists
  # for the workflow it names, and on the day the cron landed there was none, so
  # this would have opened red for a reason that is not a fault. There are now
  # two on record, measured before adding it.
  #
  # Two days rather than one, because the cron runs twice daily and GitHub is
  # late: measured on the first two firings, the 20:13Z slot ran at 22:39Z and
  # the 08:13Z slot at 13:48Z, so delays of two to five and a half hours are
  # ordinary. A one-day threshold on a twice-daily job would sit close enough to
  # its own limit to trip on lateness rather than on failure.
  freshness-itself:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: freshness.yml
      max-age-days: 2

  # Nothing watched drift.yml's cron, and that cron is the only thing that runs
  # the comparison at all: the file triggers on schedule and workflow_dispatch
  # and on nothing else, because pull_request would deadlock the three channels
  # and push to main reads the siblings from a CDN that serves the previous
  # file for minutes after a merge. A cron that quietly stops therefore stops
  # the whole check, and reports nothing while doing it.
  #
  # Three days. The schedule asks for 09:41Z and the last five firings began
  # between 13:00Z and 13:50Z, so a delay of three to four hours is the normal
  # case rather than the exception, and one day would leave no margin at all
  # over a daily cron.
  freshness-drift:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: drift.yml
      max-age-days: 3

  # audit.yml gained a daily cron in #148 and nothing watched it. That cron is
  # the only thing that runs `brew audit` against the published formulae at
  # all: the workflow's `push` trigger cannot see the commits that change them,
  # because update.yml writes them with createCommitOnBranch under GITHUB_TOKEN
  # and GitHub starts no workflow for that token's events. So the audit runs on
  # the schedule or it does not run, and a cron that stops takes the only
  # external standard the archive is measured against with it.
  #
  # Added after the cron rather than with it, the same order freshness-itself
  # took and for the same reason: reusable-schedule-freshness fails when the
  # workflow it names has no successful scheduled run, so a watcher added on
  # the day the cron landed opens red for a reason that is not a fault.
  #
  # Two days, from the two firings on record rather than from the period. The
  # cron asks for 09:19Z; the first ran 2026-09-07 at 15:05Z and the second
  # 2026-09-08 at 13:40Z, so it arrived 5h46m and 4h21m late. A one-day
  # threshold on a daily cron would spend most of its margin on GitHub being
  # late and would trip on lateness rather than on failure.
  freshness-audit:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: audit.yml
      max-age-days: 2

  # Watches the suite, the way reusable-schedule-freshness watches a cron:
  # fails when a run that should have been green was not. The other jobs in
  # this file fail for ABSENCE (a schedule stopped firing). Tests fails for
  # a different reason -- presence with a bad conclusion -- and
  # reusable-schedule-freshness cannot see it, because the newest
  # *successful* scheduled run is independent of what happened on the last
  # push. A merge that landed a red Tests re-run on `main` is invisible to
  # every other watcher in this file.
  #
  # Measured 2026-09-06 across the three channels: `Tests` failed on `main`
  # for twenty minutes (19:32 to 19:52 UTC) while a pull request whose run
  # was still reporting got merged, and the only reason anybody noticed was
  # that somebody went looking. This job surfaces that within one push or
  # one freshness tick.
  #
  # DELIBERATELY NOT A REQUIRED STATUS CHECK. A red `main` would then block
  # the pull request that repairs it, which deepens the failure this exists
  # to surface. The check name must stay advisory: the rule that fixes a
  # red `main` is "land a forward fix", and a required check is the rule
  # that prevents it. Keep this out of the ruleset.
  #
  # In-progress runs are not a verdict. The newest run whose status is
  # `completed` is what is checked, because conflating "still running"
  # with "succeeded" would mean the next green run hides any red that
  # landed while the previous one was finishing. With no completed run on
  # record at all, the script exits 1 and says so rather than passing
  # silently over an empty history.
  #
  # permissions match reusable-schedule-freshness: reading this
  # repository's run history needs `actions: read`, and a job cannot
  # elevate beyond its workflow's grant.
  tests-on-main:
    name: newest completed Tests run on main
    runs-on: ubuntu-latest
    # Measured 2 to 15 seconds for the API call (same shape as
    # reusable-schedule-freshness, which measured this on its own steps);
    # the verdict script itself runs in single-digit milliseconds. Ten
    # minutes is the floor this org uses for a job whose honest run is
    # seconds.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the newest completed Tests run on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Twenty items is enough to cover any realistic day on this repo
          # (measured: zero to three Tests runs on main per day over the
          # last week), and the script filters in-progress runs client-side
          # before picking the newest verdict, so a smaller page that
          # happens to be all queued or in-progress does not produce a
          # false negative.
          file="$(mktemp)"
          trap 'rm -f "$file"' EXIT
          gh api "repos/${REPO}/actions/workflows/tests.yml/runs?branch=main&per_page=20" > "$file"
          ./scripts/check-suite-on-main.sh "$file"
